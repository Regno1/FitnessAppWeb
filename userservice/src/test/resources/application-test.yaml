spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:userservice-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

jwt:
  secret: fittrack-super-secret-jwt-key-2024-minimum-256-bits-required
  expiration: 86400000