spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # Global CORS — applies to all routes including preflight OPTIONS requests
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:5173"
                  - "http://localhost:5174"
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            # Auth endpoints (public — login & register) → user-service
            - id: auth-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            # User profile endpoints (internal) → user-service
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**

            # AI recommendations → ai-service
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/recommendations/**

            # Activity tracking → activity-service
            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activities/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: DEBUG

# JWT shared secret — must match the value in user-service.yaml
jwt:
  secret: fittrack-super-secret-jwt-key-2024-minimum-256-bits-required
